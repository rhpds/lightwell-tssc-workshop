# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "lightwell-tssc-workshop"
  owner_email: "treddy@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "gitops"
  description: "Learners walk one linear TSSC path on a dedicated OpenShift claim: verify and mirror a Hummingbird base, consume Lightwell dependencies through an enterprise Nexus proxy, own application source (including a live Renovate PR), build hermetically with OpenShift Pipelines + BuildConfig, sign and attest, promote via stage then prod GitOps with admission, and prove continuous compliance with Lightwell GAV-bound VEX. Java is the scored app. Python and Artifactory are callouts, not a second path."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-908"
  workflow_id: "61d499a1-cfec-4d29-ad00-9f09dd08116e"

spec:
  title: "Lightwell Software Supply Chain Security Workshop"
  learning_objectives:
    - "Create an Ansible workflow in Showroom that verifies the published Hummingbird index, mirrors it from the bastion, and verifies the internal digest"
    - "Demonstrate that failed verification stops copying or publication, then publish a verified destination for Track 3"
    - "Author Maven settings.xml so Lightwell Validated and Remediated resolve from the enterprise Nexus proxy"
    - "Apply an exact-version .rhlw-* pin from a Lightwell OSV fixed event on a broken pom.xml"
    - "Create student-owned application source through an RHDH Software Template and inspect its Software Catalog registration"
    - "Bind application source to the mirrored Hummingbird digest and Lightwell pins"
    - "Merge a live Renovate PR on in-cluster Gitea that updates those pins (not a hand-edit)"
    - "Enforce a hermetic build: source forbid-list, prefetch task, and build-namespace NetworkPolicy"
    - "Produce an OpenShift BuildConfig image and SBOM"
    - "Sign the app image keylessly with RHTAS and tighten Conforma so a known-bad image fails"
    - "Verify a second application signature with the admission public key; distinguish that connected exercise from the optional mirrored-TUF transfer"
    - "Promote a signed digest through stage GitOps with unsigned-deny admission, then commit it to the prod GitOps remote"
    - "Ingest Lightwell GAV-bound VEX/SBOM into TPA and report the CVE as remediated via the Lightwell pin"
  # Coverage-first gated list (plan §4.4). duration_min 0 = untimed until dry run. Intro is ungated (no Validate Job).
  modules:
    - id: module-00
      title: "Trusted supply chain (ungated intro)"
      duration_min: 20
      status: complete
    - id: module-01
      title: "1 Build a verified base-image mirror with Ansible"
      duration_min: 90
      status: complete
    - id: module-03
      title: "2.1 Configure Maven to use Nexus"
      duration_min: 30
      status: complete
    - id: module-04
      title: "2.2 Select and verify the remediated dependency"
      duration_min: 20
      status: complete
    - id: module-05
      title: "3.1 Golden-path source"
      duration_min: 25
      status: complete
    - id: module-06
      title: "3.2 Bind base + deps in source"
      duration_min: 30
      status: complete
    - id: module-07
      title: "3.3 Live Renovate"
      duration_min: 45
      status: complete
    - id: module-08
      title: "4.1 Remove public fetches from source"
      duration_min: 30
      status: complete
    - id: module-09
      title: "4.2 Prefetch dependencies for an offline build"
      duration_min: 40
      status: complete
    - id: module-10
      title: "4.3 Restrict build-pod network access"
      duration_min: 25
      status: complete
    - id: module-11
      title: "4.4 Build the image and inspect its SBOM"
      duration_min: 45
      status: complete
    - id: module-12
      title: "5.1 Verify the application’s keyless signature"
      duration_min: 25
      status: complete
    - id: module-13
      title: "5.2 Enforce and review the signature policy"
      duration_min: 35
      status: complete
    - id: module-14
      title: "5.3 Add and verify the admission signing key"
      duration_min: 30
      status: complete
    - id: module-15
      title: "6.1 Deploy the signed image with stage GitOps"
      duration_min: 35
      status: complete
    - id: module-16
      title: "6.2 Promote the verified digest to production"
      duration_min: 30
      status: complete
    - id: module-17
      title: "7.1 SBOM system of record"
      duration_min: 30
      status: complete
    - id: module-18
      title: "7.2 VEX blast radius + ACS"
      duration_min: 40
      status: complete
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                 # minimum version; confirmed in infrastructure phase
    cluster_type: "multinode"           # sno | multinode
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 2
    worker_cpu: 16
    worker_ram_gb: 64
    worker_disk_gb: 2000

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # not applicable — AAP not a product under instruction
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # not applicable
    ai_model_name: ""                  # not applicable
    ai_justification: ""               # not applicable
    # V2-1: Hardened Images / Hummingbird went GA 12 May 2026. Do not list Lightwell or ClusterImagePolicy.
    non_ga_products: []
    non_ga_access_plan: ""
    # Learner egress only (Q22). Bot-only ghcr.io is V2-24, not this list. Gitea is in-cluster.
    external_services:
      - "registry.access.redhat.com"   # learner oc-mirror (V2-1); not quay.io/hummingbird
      - "packages.redhat.com"          # live Lightwell proxy when lightwellRepo.mode=proxy; seeded claims may not need it
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # not applicable
  # TBD until dry run. Envelope is a two-day event; do not cut coverage to fit a clock.
  duration_hours: null
  audience: "intermediate"    # beginner | intermediate | advanced

