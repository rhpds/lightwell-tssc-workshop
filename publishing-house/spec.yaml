# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Classic Showroom plus in-cluster Validate Jobs. Honor system: direct nav URLs still work; there is no UI lock and no Solve. Learners may re-run each Job without a quota. Gated modules are an Exercise, then a Review. Tracks 5 and 7 run Validate Jobs that grade live cluster or git state and a short-answer report key. Tracks 1–4 and 6 require no learner-run validation Job: Reviews use command output, evidence comparisons, and Gitea repository/PR inspection. Track 4 reuses its Git, oc, build-log, and SBOM evidence without a second validation exercise. Tracks 3, 4, and 6 have no report tokens. Track 6 uses terminal inspection of fetched Git commits, Argo CD source and revision, ImagePolicy, MachineConfigPools, pod readiness and timestamps, and saved signature-verification and unsigned-rejection evidence. The ungated intro has no Job."
    design_overview: "One linear TSSC lab on a dedicated OpenShift claim: Hummingbird verify and oc-mirror, Lightwell Maven via Nexus, learner-owned Java source including a live Renovate PR, hermetic BuildConfig pipeline, RHTAS sign plus Conforma, stage then prod GitOps with admission, and TPA ingest of Lightwell GAV-bound VEX. Python and Artifactory are callouts. Not a second FastAPI path."
    module_summaries:
      - title: "Trusted supply chain (ungated intro)"
        overview: "Seven-track diagram, what this cluster is not (no hosted Konflux, no physical air-gap, no FIPS factory), honor-system note. No Validate Job."
      - title: "1 Build a verified base-image mirror with Ansible"
        overview: "Learner clones the prepared Gitea mirror repository in Showroom, completes its Ansible scaffold, targets the bastion over SSH, compares registry state before and after, and verifies, mirrors, and verifies the image index. One independent cryptographic Check retains ID 02."
      - title: "2.1 Configure Maven to use Nexus"
        overview: "Learner clones the prepared Gitea starter and completes ~/lightwell-dependencies/settings.xml from lab-lightwell-repo so Maven resolves a Validated GAV from Nexus. No Validate Job. Python pip.conf and Artifactory virtual-repo are callouts."
      - title: "2.2 Select and verify the remediated dependency"
        overview: "Learner reads the canonical workshop advisory in the starter, compares before/after Maven evidence, and sets the OSV fixed .rhlw-* version on ~/lightwell-dependencies/pom.xml and reads it in mvn dependency:tree. No Validate Job. Track 3 commits that version. Python +rhlw.* is a callout."
      - title: "3.1 Golden-path source"
        overview: "Learner runs the RHDH Java Software Template, inspects the catalog registration and generated Gitea source, grants Renovate access, and copies stage/prod GitOps templates with explicit Git commands. Manual evidence review; no validation Job."
      - title: "3.2 Bind base + deps in source"
        overview: "Learner sets Dockerfile FROM to the mirrored Hummingbird digest and commits Lightwell pins. Seed stays UBI."
      - title: "3.3 Live Renovate"
        overview: "Learner merges a real renovate-bot PR on lightwell-pins.properties. A hand-edit fails the Check."
      - title: "4.1 Remove public fetches from source"
        overview: "Learner imports internal base images, removes public fetches and the Maven version override, and reviews committed source inputs."
      - title: "4.2 Prefetch dependencies for an offline build"
        overview: "Learner wires Task prefetch-dependencies and its source workspace before openshift-build, then configures the Dockerfile to consume the cache with offline Maven."
      - title: "4.3 Restrict build-pod network access"
        overview: "Learner records and tightens build-egress, reviews namespace and port rules and additive policy scope, and preserves app-operate for Track 6."
      - title: "4.4 Build the image and inspect its SBOM"
        overview: "Learner follows one run, saves the image digest and CycloneDX inventory, compares the selected dependency, and records a separate known-bad attempt before restoring Dockerfile."
      - title: "5.1 Verify the application’s keyless signature"
        overview: "Learner inspects the signing TaskRun, verifies the immutable application digest against the pipeline identity, and saves evidence."
      - title: "5.2 Enforce and review the signature policy"
        overview: "Learner tightens a separate Conforma policy, wires it after signing, and compares unsigned-builder and signed-application reports without claiming provenance attestation."
      - title: "5.3 Add and verify the admission signing key"
        overview: "Learner adds a key-based signature, verifies with the public key exported from the admission ConfigMap, and carries the same digest to Track 6. Mirrored TUF is an optional appendix exercise."
      - title: "6.1 Deploy the signed image with stage GitOps"
        overview: "Stage GitOps plus unsigned deny from the learner TrustPolicy. VM/canary/blue-green are callouts."
      - title: "6.2 Promote the verified digest to production"
        overview: "Learner commits the signed digest to the prod Gitea remote. Learner verifies the production Argo source and revision, digest, readiness, and ImagePolicy through terminal output. No learner-run validation Job or report token."
      - title: "7.1 SBOM system of record"
        overview: "Learner ingests/labels the promoted digest in TPA."
      - title: "7.2 VEX blast radius + ACS"
        overview: "C+: Lightwell GAV-bound VEX from Nexus; report says CVE fixed via the pin. Hummingbird/CSAF is a callout. ACS is not the disabled stub."
    rcars_overlap_pct: 100
    rcars_top_matches:
      - title: "Enhancing Developer Efficiency and Security with Trusted Application Pipeline"
        ci_name: "sandboxes-gpte.enhancing-developer.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.enhancing-developer.prod"
        relevance_score: 100
        why_it_fits: "Covers the full RHTAP stack — RHTAS, RHTPA, RHACS, OpenShift Pipelines, OpenShift GitOps, RHDH — with hands-on signing, SBOM ingestion, and GitOps promotion."
      - title: "Build Secure, Streamlined Developer Workflows with Red Hat Advanced Developer Suite"
        ci_name: "published.rhads-secure-dev-workflows.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.rhads-secure-dev-workflows.prod"
        relevance_score: 91
        why_it_fits: "Covers all six requested products with dedicated content on SBOM ingest, keyless signing, Tekton policy gates via Enterprise Contract, and GitOps-driven promotion."
      - title: "LB1464: Unifying DevSecOps: Secure, Standardized Application Delivery Across Containers (CNV)"
        ci_name: "summit-2026.lb1464-unified-devsecops-delivery-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb1464-unified-devsecops-delivery-cnv.prod"
        relevance_score: 88
        why_it_fits: "Covers TSSC full stack including TAS, TPA, RHACS, RHDH, Tekton, and Argo CD with supply-chain policy enforcement and keyless signing."
    catalog_gap: "No existing catalog item walks the Lightwell-plus-Hummingbird TSSC path as seven gated tracks on one claim: learner-run oc-mirror, live Renovate against Gitea, hermetic BuildConfig (not hosted Konflux), portable TrustPolicy admission, prod GitOps remote, and GAV-bound VEX. Dual Java+Python hands-on is not the v2 catalog structure."
    rejections: []

