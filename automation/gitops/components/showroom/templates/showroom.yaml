{{- if .Values.showroom.enabled }}
---
# Showroom Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.showroom.namespace | default "showroom" }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.namespace | quote }}
---
# Showroom ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.config | quote }}
---
# Showroom RoleBinding — terminal SA can manage resources in the showroom NS
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-{{ .Values.showroom.name }}-sa
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.config | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
---
# Nginx proxy — content (:8000) + optional terminal (/terminal/ → :7681)
kind: ConfigMap
metadata:
  name: {{ .Values.showroom.name }}-proxy-config
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.config | quote }}
apiVersion: v1
data:
  nginx.conf: |
    events {
    }
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      proxy_cache off;
      expires -1;
      proxy_cache_path /dev/null keys_zone=mycache:10m;
      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }
      server {
        listen 8080;
        absolute_redirect off;
        location / {
          proxy_pass http://127.0.0.1:8000;
          expires off;
          proxy_cache off;
          proxy_pass_request_headers on;
          proxy_set_header Accept-Encoding "gzip";
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        {{- if .Values.showroom.terminal.enabled }}
        location /terminal/ {
          proxy_pass http://127.0.0.1:7681;
          rewrite ^/terminal/(.*)$ /$1 break;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 43200000;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          proxy_set_header X-NginX-Proxy true;
        }
        {{- end }}
      }
    }
---
# Antora userdata attributes (cluster_domain for lab attribute substitution)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.showroom.name }}-userdata
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.config | quote }}
data:
  user_data.yml: |
    cluster_domain: {{ .Values.deployer.domain }}
    demo_namespace: {{ .Values.demo.namespace }}
    demo_app: {{ .Values.demo.appName }}
    workshop: lightwell-tssc-workshop
    modules: "1-5"
    # Student Git (Module 5) — discover live values from lab-gitea in ns gitea
    gitea_namespace: gitea
    student_git_lab_config: lab-gitea
    gitea_url: {{ include "showroom.giteaUrl" . | quote }}
    hummingbird_source_pullspec: {{ .Values.lab.hummingbirdSourcePullSpec | quote }}
    dest_registry_host: {{ include "showroom.destRegistryHost" . | quote }}
    dest_registry_docker: {{ printf "docker://%s" (include "showroom.destRegistryHost" .) | quote }}
---
# PVC must share the Deployment sync wave. gp3-csi uses WaitForFirstConsumer —
# a PVC-only earlier wave stays Pending forever and deadlocks App-of-Apps sync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.showroom.name }}-terminal-lab-user-home
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.workload | quote }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.showroom.pvc.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.workload | quote }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: {{ .Values.showroom.name }}
---
# Split-screen: nginx + Antora content + OCP terminal (Showroom theme from site.yml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.workload | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.showroom.name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.showroom.name }}
        {{- include "showroom.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.showroom.name }}
      {{- if and .Values.showroom.terminal.enabled .Values.showroom.terminal.homeFsGroup }}
      # #58: Ceph RBD home PVC is root:root without fsGroup; terminal is uid 1000.
      securityContext:
        fsGroup: {{ .Values.showroom.terminal.homeFsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      initContainers:
      {{- if and .Values.showroom.terminal.enabled .Values.showroom.terminal.tools.enabled }}
      {{- range .Values.showroom.terminal.tools.items }}
      - name: copy-{{ .name }}
        image: {{ .image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            dest="/lab-bin/{{ .name }}"
            for c in "/usr/bin/{{ .name }}" "/usr/local/bin/{{ .name }}"; do
              if [ -x "$c" ]; then
                cp -a "$c" "$dest"
                chmod 0755 "$dest"
                ls -l "$dest"
                exit 0
              fi
            done
            src="$(command -v {{ .name }} 2>/dev/null || true)"
            if [ -n "$src" ] && [ -x "$src" ]; then
              cp -a "$src" "$dest"
              chmod 0755 "$dest"
              ls -l "$dest"
              exit 0
            fi
            echo "ERROR: {{ .name }} not found in image {{ .image }}" >&2
            exit 1
        volumeMounts:
          - name: lab-bin
            mountPath: /lab-bin
      {{- end }}
      {{- end }}
      - name: git-cloner
        image: {{ .Values.showroom.content.gitClonerImage | quote }}
        env:
        - name: GIT_REPO_URL
          value: {{ .Values.showroom.content.repoUrl | quote }}
        - name: GIT_REPO_REF
          value: {{ .Values.showroom.content.repoRef | quote }}
        - name: CLONE_DIR
          value: "/showroom/repo"
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-files
          subPath: repo
      - name: antora-builder
        image: {{ .Values.showroom.content.antoraImage | quote }}
        env:
        - name: FILES_DIR
          value: "/showroom/repo"
        - name: OUTPUT_DIR
          value: "/showroom/www"
        - name: ANTORA_SITE_FILE
          value: {{ .Values.showroom.content.antoraPlaybook | quote }}
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-files
          subPath: repo
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/www
          name: showroom-files
          subPath: www
      containers:
      - name: nginx
        image: {{ .Values.showroom.content.nginxImage | quote }}
        imagePullPolicy: "IfNotPresent"
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-config
          subPath: nginx.conf
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run
          name: nginx-pid
        ports:
        - name: web
          containerPort: 8080
      - name: content
        image: {{ .Values.showroom.content.image | quote }}
        imagePullPolicy: "IfNotPresent"
        env:
        - name: GIT_REPO_URL
          value: {{ .Values.showroom.content.repoUrl | quote }}
        - name: GIT_REPO_REF
          value: {{ .Values.showroom.content.repoRef | quote }}
        - name: ANTORA_PLAYBOOK
          value: {{ .Values.showroom.content.antoraPlaybook | quote }}
        - name: DOMAIN
          value: {{ .Values.deployer.domain | quote }}
        {{- if .Values.showroom.nookbag.enabled }}
        - name: ZT_BUNDLE
          value: {{ .Values.showroom.nookbag.bundleUrl | quote }}
        - name: ZT_UI_ENABLED
          value: "true"
        # Empty → content image loads ui-config.yml from the cloned workshop repo root
        - name: SHOWROOM_UI_CONFIG
          value: ""
        - name: GUID
          value: {{ .Values.showroom.namespace | quote }}
        {{- end }}
        volumeMounts:
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/repo
          name: showroom-files
          subPath: repo
        - mountPath: /showroom/www
          name: showroom-files
          subPath: www
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8000
        readinessProbe:
          httpGet:
            path: /
            port: 8000
      {{- if .Values.showroom.terminal.enabled }}
      - name: terminal
        image: {{ .Values.showroom.terminal.image | quote }}
        imagePullPolicy: IfNotPresent
        env:
        - name: HOME
          value: /home/lab-user
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.showroom.terminal.tools.enabled }}
        - name: PATH
          value: "{{ .Values.showroom.terminal.tools.mountDir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        {{- end }}
        # #77: author + Gitea store so listings can `git commit` / `git push origin HEAD`.
        lifecycle:
          postStart:
            exec:
              command: ["/bin/bash", "/usr/local/libexec/lab-git-setup.sh"]
        volumeMounts:
        - name: terminal-lab-user-home
          mountPath: /home/lab-user
        - name: lab-git-setup
          mountPath: /usr/local/libexec/lab-git-setup.sh
          subPath: lab-git-setup.sh
        {{- if .Values.showroom.terminal.tools.enabled }}
        {{- range .Values.showroom.terminal.tools.items }}
        - name: lab-bin
          mountPath: {{ printf "%s/%s" $.Values.showroom.terminal.tools.mountDir .name | quote }}
          subPath: {{ .name | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 7681
          protocol: TCP
        resources:
          limits:
            cpu: {{ .Values.showroom.terminal.resources.limits.cpu }}
            memory: {{ .Values.showroom.terminal.resources.limits.memory }}
          requests:
            cpu: {{ .Values.showroom.terminal.resources.requests.cpu }}
            memory: {{ .Values.showroom.terminal.resources.requests.memory }}
      {{- end }}
      volumes:
      - name: showroom-files
        emptyDir: {}
      - name: user-data
        configMap:
          name: {{ .Values.showroom.name }}-userdata
      - name: nginx-config
        configMap:
          defaultMode: 420
          name: {{ .Values.showroom.name }}-proxy-config
      - name: nginx-pid
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: terminal-lab-user-home
        persistentVolumeClaim:
          claimName: {{ .Values.showroom.name }}-terminal-lab-user-home
      {{- if .Values.showroom.terminal.enabled }}
      - name: lab-git-setup
        configMap:
          name: {{ .Values.showroom.name }}-lab-git-setup
          defaultMode: 0755
      {{- end }}
      {{- if and .Values.showroom.terminal.enabled .Values.showroom.terminal.tools.enabled }}
      - name: lab-bin
        emptyDir: {}
      {{- end }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
  labels:
    {{- include "showroom.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.showroom.syncWaves.route | quote }}
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  host: {{ include "showroom.routeHost" . }}
  to:
    kind: Service
    name: {{ .Values.showroom.name }}
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
