# Software Template — lightwell-java-service (issue #12 / #120)
# Skeleton: workshop-templates/lightwell-java-service (Gitea; seeded from
#   automation/gitops/components/rhdh/files/skeletons/lightwell-java-service by gitea seed Job)
# Publish target: in-cluster Gitea only (AGENTS.md Learner Git). Host substituted at install:
#   GITEA_HOST_PLACEHOLDER → gitea.<deployer.domain>
# Learner org lw-student (created in module 3.1) + repo spring-boot-lw-poc.
# Upstream publish:gitea requires a Gitea Organization (not a normal user).
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: lightwell-java-service
  title: Lightwell Java Service
  description: >-
    Create the workshop Java application on student-owned Gitea and register it
    in the Software Catalog. Includes the intentionally unfinished base image,
    dependency version, Renovate pins, and build files used in Tracks 3–7.
  tags:
    - lightwell
    - java
    - maven
    - spring-boot
    - rhtas
    - gitea
    - recommended
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/lightwell-workshop
  type: service
  parameters:
    - title: Service information
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Maven artifactId and Kubernetes-safe service name
          pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'
          default: spring-boot-lw-poc
          const: spring-boot-lw-poc
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: Spring Boot service using Lightwell Network Maven streams
        owner:
          title: Owner
          type: string
          default: group:default/lightwell-workshop
        system:
          title: System
          type: string
          default: lightwell-tssc-workshop
        groupId:
          title: Maven groupId
          type: string
          default: com.redhat.lightwell.workshop
        javaPackage:
          title: Java package
          type: string
          default: com.redhat.lightwell.workshop
          description: Used in package declarations (match javaPath below)
        javaPath:
          title: Java source path
          type: string
          default: com/redhat/lightwell/workshop
          description: Directory path under src/main/java (slashes, not dots)
    - title: Lightwell Network
      properties:
        lwnProfile:
          title: Default settings.xml active profile
          type: string
          default: lightwell-validated
          enum:
            - lightwell-validated
            - lightwell-remediated
          enumNames:
            - Validated (upstream-parity rebuilds)
            - Remediated (use with lightwell-remediated-pins for .rhlw-*)
    - title: Publication (Gitea)
      required:
        - repoOwner
      properties:
        repoOwner:
          title: Gitea organization
          type: string
          description: >-
            Workshop organization lw-student (created in module 3.1).
            Upstream publish:gitea creates repositories under Organizations only.
          pattern: '^lw-[a-zA-Z0-9]([a-zA-Z0-9._-]{0,38}[a-zA-Z0-9])?$'
          default: lw-student
        repoName:
          title: Repository name
          type: string
          const: spring-boot-lw-poc
          default: spring-boot-lw-poc
          description: Fixed so student_repo_url stays stable throughout the workshop
        defaultBranch:
          title: Default branch
          type: string
          default: main
  steps:
    - id: fetch-base
      name: Fetch Lightwell Java skeleton
      action: fetch:template
      input:
        # GiteaUrlReader requires .../src/branch/<ref> (plain owner/repo yields commits/undefined).
        url: https://GITEA_HOST_PLACEHOLDER/workshop-templates/lightwell-java-service/src/branch/main
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          groupId: ${{ parameters.groupId }}
          javaPackage: ${{ parameters.javaPackage }}
          javaPath: ${{ parameters.javaPath }}
          lwnProfile: ${{ parameters.lwnProfile }}
          repoOwner: ${{ parameters.repoOwner }}
          repoName: spring-boot-lw-poc

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: GITEA_HOST_PLACEHOLDER?owner=${{ parameters.repoOwner }}&repo=spring-boot-lw-poc
        defaultBranch: ${{ parameters.defaultBranch }}
        repoVisibility: public

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        # Use catalogInfoUrl — Gitea resolveUrl drops the branch when catalogInfoPath
        # starts with "/" (produces .../src/branch/catalog-info.yaml → 400).
        catalogInfoUrl: ${{ steps.publish.output.repoContentsUrl }}catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Continue Track 3
        content: |
          Created **${{ parameters.name }}** in
          `${{ parameters.repoOwner }}/spring-boot-lw-poc` and registered its catalog component.

          Return to Showroom module 3.1 to grant `renovate-bot` write access and
          copy the stage and production GitOps templates using the explicit Git commands.
          Verify the generated starting files and both output links.

          In module 3.2, commit the verified Hummingbird destination and the
          exact Lightwell dependency version. In module 3.3, review and merge
          Renovate's update to `lightwell-pins.properties`.
          Track 4 completes the hermetic build; Tracks 5–7 cover signing,
          promotion, and continuous compliance. Do not delete this repository
          or replace its history to repeat template creation.
