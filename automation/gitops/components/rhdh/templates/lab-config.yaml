{{- if and .Values.rhdh.enabled .Values.labConfig.enabled }}
{{- $baseUrl := include "rhdh.baseUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-rhdh
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhdh.syncWaves.labConfig | quote }}
data:
  demo_title: {{ .Values.labConfig.title | quote }}
  access_instructions: {{ .Values.labConfig.instructions | quote }}
  deployment_type: "helm"
  operator_name: {{ .Values.operator.name | quote }}
  rhdh_namespace: {{ .Values.rhdh.namespace | quote }}
  rhdh_name: {{ .Values.rhdh.name | quote }}
  rhdh_url: {{ $baseUrl | quote }}
  software_template: "lightwell-java-service"
{{- if .Values.softwareTemplates.python.enabled }}
  software_template_python: "lightwell-python-service"
{{- end }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- end }}
