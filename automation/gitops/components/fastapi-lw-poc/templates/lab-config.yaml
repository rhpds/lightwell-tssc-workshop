{{- if and .Values.fastapiLwPoc.enabled .Values.labConfig.enabled }}
{{- $appUrl := include "fastapi-lw-poc.appUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-fastapi-lw-poc
  namespace: {{ .Values.fastapiLwPoc.namespace }}
  labels:
    {{- include "fastapi-lw-poc.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.fastapiLwPoc.syncWaves.labConfig | quote }}
data:
  demo_title: {{ .Values.labConfig.title | quote }}
  access_instructions: {{ .Values.labConfig.instructions | quote }}
  deployment_type: "helm"
  app_url: {{ $appUrl | quote }}
  greeting_url: "{{ $appUrl }}/api/greeting"
  docs_url: "{{ $appUrl }}/docs"
  lightwell_stream: {{ .Values.lightwellStream | quote }}
  source_path: "requirements.txt (Gitea fastapi-lw-poc repo root)"
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- end }}
