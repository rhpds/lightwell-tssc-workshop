{{- if .Values.networkPolicy.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.build.namespace }}
  labels:
    {{- include "networkpolicy.labels" . | nindent 4 }}
    lightwell.workshop/role: build
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: {{ .Values.networkPolicy.syncWaves.namespace | quote }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.stage.namespace }}
  labels:
    {{- include "networkpolicy.labels" . | nindent 4 }}
    lightwell.workshop/role: stage
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: {{ .Values.networkPolicy.syncWaves.namespace | quote }}
---
# Bootstrap assigns this namespace exclusively to networkpolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.prod.namespace }}
  labels:
    {{- include "networkpolicy.labels" . | nindent 4 }}
    lightwell.workshop/role: prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: {{ .Values.networkPolicy.syncWaves.namespace | quote }}
{{- end }}
