{{- if and .Values.rhacs.enabled .Values.labConfig.enabled }}
{{- $centralUrl := include "rhacs.centralUrl" . }}
{{- $endpoint := include "rhacs.centralEndpoint" . }}
{{- $internalEndpoint := include "rhacs.centralInternalEndpoint" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-rhacs
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rhacs.syncWaves.labConfig | quote }}
data:
  demo_title: {{ .Values.labConfig.title | quote }}
  access_instructions: {{ .Values.labConfig.instructions | quote }}
  deployment_type: "helm"
  operator_name: {{ .Values.operator.packageName | quote }}
  rhacs_namespace: {{ .Values.rhacs.namespace | quote }}
  central_name: {{ .Values.central.name | quote }}
  central_url: {{ $centralUrl | quote }}
  central_endpoint: {{ $endpoint | quote }}
  central_internal_endpoint: {{ $internalEndpoint | quote }}
  pipeline_task: {{ .Values.pipelineHooks.taskName | quote }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- end }}
