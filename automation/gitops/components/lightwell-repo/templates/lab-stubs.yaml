{{- if and .Values.lightwellRepo.enabled .Values.labStubs.enabled }}
---
# V2-53 incomplete 7.2 blast-radius report. Quiz keys stay V2-59.
# Modules 2.1 and 2.2 write ~/track-2-1-settings.xml and ~/track-2-2/pom.xml.
# They have no stub ConfigMap and no Validate Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.labStubs.blastRadius.configMapName }}
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
    app.kubernetes.io/component: lab-stub
    tssc.workshop/module: "18"
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.config | quote }}
data:
  {{ .Values.labStubs.blastRadius.key }}: |
{{ .Files.Get "files/stubs/blast-radius.txt" | indent 4 }}
{{- end }}
