{{- if .Values.lightwellRepo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: track1-ansible
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.config | quote }}
data:
{{- range $path, $_ := .Files.Glob "files/track1/*.yml" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
