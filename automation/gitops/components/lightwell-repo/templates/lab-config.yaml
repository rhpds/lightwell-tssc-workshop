{{- if and .Values.lightwellRepo.enabled .Values.labConfig.enabled }}
{{- $nexusUrl := include "lightwell-repo.nexusUrl" . }}
{{- $nexusInternalUrl := include "lightwell-repo.nexusInternalUrl" . }}
{{- $regUrl := include "lightwell-repo.registryUrl" . }}
{{- $regHost := include "lightwell-repo.registryHost" . }}
{{- $regInternalHost := include "lightwell-repo.registryInternalHost" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-lightwell-repo
  namespace: {{ .Values.lightwellRepo.namespace }}
  labels:
    {{- include "lightwell-repo.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.lightwellRepo.syncWaves.labConfig | quote }}
data:
  demo_title: {{ .Values.labConfig.title | quote }}
  access_instructions: {{ .Values.labConfig.instructions | quote }}
  deployment_type: "helm"
  lightwell_repo_mode: {{ .Values.lightwellRepo.mode | quote }}
  nexus_url: {{ $nexusUrl | quote }}
  nexus_internal_url: {{ $nexusInternalUrl | quote }}
  maven_public_repo: maven-public
  channel_validated: {{ .Values.channels.validated.name | quote }}
  channel_remediated: {{ .Values.channels.remediated.name | quote }}
  channel_osv: {{ .Values.channels.osv.name | quote }}
  channel_pypi_validated: {{ .Values.channels.pypiValidated.name | quote }}
  channel_pypi_remediated: {{ .Values.channels.pypiRemediated.name | quote }}
  pypi_validated_enabled: {{ .Values.channels.pypiValidated.enabled | quote }}
  pypi_remediated_enabled: {{ .Values.channels.pypiRemediated.enabled | quote }}
  canonical_validated: {{ .Values.channels.validated.remoteUrl | quote }}
  canonical_remediated: {{ .Values.channels.remediated.remoteUrl | quote }}
  canonical_osv: {{ .Values.channels.osv.remoteUrl | quote }}
  canonical_pypi_validated: {{ .Values.channels.pypiValidated.remoteUrl | quote }}
  canonical_pypi_remediated: {{ .Values.channels.pypiRemediated.remoteUrl | quote }}
  pypi_index_validated: {{ printf "%s/repository/%s/simple" $nexusUrl .Values.channels.pypiValidated.name | quote }}
  pypi_index_remediated: {{ printf "%s/repository/%s/simple" $nexusUrl .Values.channels.pypiRemediated.name | quote }}
  pypi_seed_package: {{ printf "%s==%s" .Values.pypiSeed.package .Values.pypiSeed.version | quote }}
  pypi_seed_remediated: {{ printf "%s==%s" .Values.pypiSeed.remediatedPackage .Values.pypiSeed.remediatedVersion | quote }}
  version_suffix_example: {{ .Values.sampleOsv.remediatedVersion | quote }}
  scored_vex_id: {{ .Values.sampleVex.vulnerabilityId | quote }}
  scored_vex_gav: {{ printf "%s:%s" .Values.sampleVex.packageName .Values.sampleVex.remediatedVersion | quote }}
  scored_vex_base_version: {{ .Values.sampleVex.baseVersion | quote }}
  scored_vex_maven_cdx: {{ printf "%s/repository/%s/org/apache/commons/commons-lang3/%s/commons-lang3-%s-cdx.json" $nexusUrl .Values.channels.remediated.name .Values.sampleVex.remediatedVersion .Values.sampleVex.remediatedVersion | quote }}
  scored_vex_maven_vex: {{ printf "%s/repository/%s/org/apache/commons/commons-lang3/%s/commons-lang3-%s-vex.json" $nexusUrl .Values.channels.remediated.name .Values.sampleVex.remediatedVersion .Values.sampleVex.remediatedVersion | quote }}
  scored_vex_raw_cdx: {{ printf "%s/repository/%s/%s" $nexusUrl .Values.channels.osv.name .Values.sampleVex.rawCdxPath | quote }}
  scored_vex_raw_vex: {{ printf "%s/repository/%s/%s" $nexusUrl .Values.channels.osv.name .Values.sampleVex.rawVexPath | quote }}
  scored_vex_osv: {{ printf "%s/repository/%s/osv/java/remediated/%s.json" $nexusUrl .Values.channels.osv.name .Values.sampleVex.vulnerabilityId | quote }}
  live_csaf_gate: {{ .Values.sampleVex.liveCsafGate | quote }}
  credentials_secret: {{ .Values.credentials.secretName | quote }}
  maven_settings_configmap: {{ .Values.mavenSettings.configMapName | quote }}
  pip_settings_configmap: {{ .Values.pipSettings.configMapName | quote }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- if .Values.channels.dockerMirror.enabled }}
  dest_registry_host: {{ $regHost | quote }}
  dest_registry_internal_host: {{ $regInternalHost | quote }}
  dest_registry_url: {{ $regUrl | quote }}
  dest_registry_docker: {{ printf "docker://%s" $regHost | quote }}
  dest_registry_repo: {{ .Values.channels.dockerMirror.name | quote }}
  hummingbird_source_pullspec: {{ .Values.ocMirror.sourcePullSpec | quote }}
  oc_mirror_plugin_image: {{ .Values.ocMirror.pluginImage | quote }}
  oc_mirror_pre_stage_scored_image: "false"
  imageset_configmap: {{ .Values.ocMirror.imageSet.configMapName | quote }}
  imageset_key: {{ .Values.ocMirror.imageSet.key | quote }}
  oc_mirror_job_configmap: {{ .Values.ocMirror.configMapName | quote }}
{{- end }}
{{- if .Values.labStubs.enabled }}
  stub_03_configmap: {{ .Values.labStubs.settings.configMapName | quote }}
  stub_03_key: {{ .Values.labStubs.settings.key | quote }}
  stub_04_configmap: {{ .Values.labStubs.pom.configMapName | quote }}
  stub_04_key: {{ .Values.labStubs.pom.key | quote }}
  stub_18_configmap: {{ .Values.labStubs.blastRadius.configMapName | quote }}
  stub_18_key: {{ .Values.labStubs.blastRadius.key | quote }}
{{- end }}
{{- end }}
