<rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Signed application</text>
<text class="body" x="51" y="166">Pinned verified digest</text>
<text class="body" x="51" y="206">Destination signature verified</text>
<text class="body" x="51" y="246">One Ready stage replica</text>
