  <text x="55" y="367" class="body">~/lightwell-dependencies/pom.xml</text>
  <text x="55" y="396" class="body">3.14.0.rhlw-00001</text>
  <path d="M455,360 L605,360" stroke="#52606d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="478" y="342" class="note">exact version</text>
  <rect x="620" y="295" width="445" height="130" rx="12" fill="#edf7fa" stroke="#b7c9d3"/>
  <text x="640" y="331" class="head">pom.xml · default property</text>
  <text x="640" y="367" class="body">Top-level commons.lang3.version</text>
  <text x="640" y="396" class="body">3.14.0.rhlw-00001</text>
  <rect x="35" y="457" width="1030" height="93" rx="12" fill="#fff6e5" stroke="#b7c9d3"/>
