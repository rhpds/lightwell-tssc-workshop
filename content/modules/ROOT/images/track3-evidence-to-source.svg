  <text x="55" y="221" class="body">status: verified</text>
  <text x="55" y="250" class="body">destination_pullspec</text>
  <path d="M455,191 L605,191" stroke="#52606d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="481" y="173" class="note">exact value</text>
  <rect x="620" y="120" width="445" height="145" rx="12" fill="#edf7fa" stroke="#b7c9d3"/>
  <text x="640" y="156" class="head">Dockerfile · runtime FROM</text>
  <text x="640" y="192" class="body">Destination host / hi/openjdk</text>
  <text x="640" y="221" class="body">@sha256:&lt;verified index digest&gt;</text>
  <text x="640" y="250" class="body">Keep the build-stage FROM on UBI.</text>
  <rect x="35" y="295" width="410" height="130" rx="12" fill="#edf7fa" stroke="#b7c9d3"/>
