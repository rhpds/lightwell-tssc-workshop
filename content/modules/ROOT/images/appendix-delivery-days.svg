<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Two-day grouping follows the evidence handoffs</title><desc id="desc">Measure actual timings during dry runs. Complete each handoff before advancing to the next track.</desc><rect width="1200" height="400" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:22px;font-weight:bold} .body{font-size:17px}</style><text x="35" y="48" font-size="29" font-weight="bold">Two-day grouping follows the evidence handoffs</text><rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Day 1 · Tracks 1–3</text><text class="body" x="51" y="166">Verify and mirror the base</text><text class="body" x="51" y="206">Select the dependency version</text><text class="body" x="51" y="246">Publish source; merge Renovate</text><path d="M 390 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="425" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="441" y="124">Keep the handoff</text><text class="body" x="441" y="166">Same cluster and repositories</text><text class="body" x="441" y="206">Verified base and exact library</text><text class="body" x="441" y="246">Reviewed source and saved evidence</text><path d="M 780 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="815" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="831" y="124">Day 2 · Tracks 4–7</text><text class="body" x="831" y="166">Build and inspect the inventory</text><text class="body" x="831" y="206">Sign, apply policy, and promote</text><text class="body" x="831" y="246">Retrieve inventory; assess with ACS</text><text x="35" y="345" font-size="18">Measure actual timings during dry runs. Complete each handoff before advancing to the next track.</text></svg>
