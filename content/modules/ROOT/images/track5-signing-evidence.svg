<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Follow one run from signing to verification</title><desc id="desc">A successful signing TaskRun and a verified image digest answer different questions. Keep both.</desc><rect width="1200" height="380" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:23px;font-weight:bold} .body{font-size:19px}</style>
<text x="35" y="48" font-size="30" font-weight="bold">Follow one run from signing to verification</text>
<rect x="35" y="85" width="350" height="205" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="53" y="125">1 · Select the run</text>
<text class="body" x="53" y="170">Use the Track 4 run name</text>
<text class="body" x="53" y="207">Inspect cosign-sign-keyless</text>
<text class="body" x="53" y="244">Require TaskRun status True</text>
