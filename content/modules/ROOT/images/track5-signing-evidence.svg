<rect x="425" y="85" width="350" height="205" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="443" y="125">2 · Verify the digest</text>
<text class="body" x="443" y="170">Resolve latest to @sha256:…</text>
<text class="body" x="443" y="207">Check pipeline identity + issuer</text>
<text class="body" x="443" y="244">Use Showroom Route endpoints</text>
<path d="M 780 187 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/>
<rect x="815" y="85" width="350" height="205" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="833" y="125">3 · Save the evidence</text>
<text class="body" x="833" y="170">Keep run name + image reference</text>
<text class="body" x="833" y="207">Save successful verify output</text>
<text class="body" x="833" y="244">Refresh evidence after a rebuild</text>
<text x="35" y="340" font-size="19">A successful signing TaskRun and a verified image digest answer different questions. Keep both.</text></svg>
