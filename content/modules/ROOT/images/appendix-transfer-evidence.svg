<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Plan the transfer around one immutable image</title><desc id="desc">The optional workshop folder contains evidence only. It is not an image transfer or an offline verification.</desc><rect width="1200" height="400" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:22px;font-weight:bold} .body{font-size:17px}</style><text x="35" y="48" font-size="29" font-weight="bold">Plan the transfer around one immutable image</text><rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Prepare</text><text class="body" x="51" y="166">Approved image digest</text><text class="body" x="51" y="206">Signatures and trusted public keys</text><text class="body" x="51" y="246">Matching inventory and advisories</text><path d="M 390 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="425" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="441" y="124">Transfer</text><text class="body" x="441" y="166">Image manifest and layers</text><text class="body" x="441" y="206">Required verification artifacts</text><text class="body" x="441" y="246">Recorded package checksums</text><path d="M 780 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="815" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="831" y="124">Verify at destination</text><text class="body" x="831" y="166">Compare destination digest</text><text class="body" x="831" y="206">Apply destination trust policy</text><text class="body" x="831" y="246">Record verification before release</text><text x="35" y="345" font-size="18">The optional workshop folder contains evidence only. It is not an image transfer or an offline verification.</text></svg>
