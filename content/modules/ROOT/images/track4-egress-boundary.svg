<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc">
<title id="title">4.3 • Limit build-pod egress</title><desc id="desc">build-egress selects all pods in the build namespace; rules use destination pod ports. Public pod egress is excluded. Node image pulls and app-operate are outside this policy.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#526477"/></marker></defs>
