<g font-family="Arial, sans-serif">
<text x="36" y="48" font-size="28" font-weight="700" fill="#142c42">4.3 • Limit build-pod egress</text>
<text x="36" y="81" font-size="18" fill="#42566b">build-egress selects all pods in the build namespace; rules use destination pod ports.</text>
<rect x="36" y="112" width="416" height="94" rx="10" fill="#e5edf7" stroke="#b8c8d7"/>
