<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Follow the promoted image into TPA</title><desc id="desc">An upload response is not the final comparison. Retrieve the stored document and inspect it.</desc><rect width="1200" height="400" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:22px;font-weight:bold} .body{font-size:17px}</style><text x="35" y="48" font-size="29" font-weight="bold">Follow the promoted image into TPA</text><rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Production identity</text><text class="body" x="51" y="166">Fetched production Git commit</text><text class="body" x="51" y="206">Saved signed image digest</text><text class="body" x="51" y="246">Live Deployment: same digest</text><path d="M 390 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="425" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="441" y="124">Matching application SBOM</text><text class="body" x="441" y="166">CycloneDX root = image digest</text><text class="body" x="441" y="206">Nonempty component inventory</text><text class="body" x="441" y="246">Inspect Commons Lang version</text><path d="M 780 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="815" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="831" y="124">Stored evidence</text><text class="body" x="831" y="166">Upload application inventory</text><text class="body" x="831" y="206">List and download by TPA ID</text><text class="body" x="831" y="246">Compare root and components</text><text x="35" y="345" font-size="18">An upload response is not the final comparison. Retrieve the stored document and inspect it.</text></svg>
