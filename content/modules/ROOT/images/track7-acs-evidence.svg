<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Inspect one ACS attempt for the promoted digest</title><desc id="desc">A standalone TaskRun checks the promoted image; it does not claim that a new full pipeline succeeded.</desc><rect width="1200" height="400" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:22px;font-weight:bold} .body{font-size:17px}</style><text x="35" y="48" font-size="29" font-weight="bold">Inspect one ACS attempt for the promoted digest</text><rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Configure future builds</text><text class="body" x="51" y="166">Edit the ACS task parameter</text><text class="body" x="51" y="206">Set fail-on-skipped to true</text><text class="body" x="51" y="246">Commit, fetch, and apply</text><path d="M 390 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="425" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="441" y="124">Run the existing ACS Task</text><text class="body" x="441" y="166">Use promoted image@sha256</text><text class="body" x="441" y="206">Create a named TaskRun attempt</text><text class="body" x="441" y="246">No rebuild or tag replacement</text><path d="M 780 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="815" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="831" y="124">Interpret the evidence</text><text class="body" x="831" y="166">Match TaskRun image and result</text><text class="body" x="831" y="206">Read policy response and logs</text><text class="body" x="831" y="246">Separate violations from errors</text><text x="35" y="345" font-size="18">A standalone TaskRun checks the promoted image; it does not claim that a new full pipeline succeeded.</text></svg>
