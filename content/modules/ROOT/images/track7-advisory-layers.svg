<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Separate inventory from security conclusions</title><desc id="desc">The sample fixes the exact Lightwell version. It does not establish that the whole image is vulnerability-free.</desc><rect width="1200" height="400" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:22px;font-weight:bold} .body{font-size:17px}</style><text x="35" y="48" font-size="29" font-weight="bold">Separate inventory from security conclusions</text><rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Application inventory</text><text class="body" x="51" y="166">Which version is installed?</text><text class="body" x="51" y="206">Promoted image CycloneDX</text><text class="body" x="51" y="246">Match the exact Maven GAV</text><path d="M 390 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="425" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="441" y="124">Library advisory</text><text class="body" x="441" y="166">OSV fixed event → TPA advisory</text><text class="body" x="441" y="206">OpenVEX product → local review</text><text class="body" x="441" y="246">LW-DEMO-0002 is a sample</text><path d="M 780 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="815" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="831" y="124">Separate controls</text><text class="body" x="831" y="166">OS CSAF: operating-system layer</text><text class="body" x="831" y="206">ACS: configured image policies</text><text class="body" x="831" y="246">Admission: signature enforcement</text><text x="35" y="345" font-size="18">The sample fixes the exact Lightwell version. It does not establish that the whole image is vulnerability-free.</text></svg>
