<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">A changed manifest starts a review</title><desc id="desc">A checksum change is a signal to investigate. It does not establish that a fix applies to your application.</desc><rect width="1200" height="400" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#172b3a} .heading{font-size:22px;font-weight:bold} .body{font-size:17px}</style><text x="35" y="48" font-size="29" font-weight="bold">A changed manifest starts a review</text><rect x="35" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="51" y="124">Detect</text><text class="body" x="51" y="166">Fetch an authorized manifest</text><text class="body" x="51" y="206">Compare with its saved checksum</text><text class="body" x="51" y="246">Separate changes from fetch errors</text><path d="M 390 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="425" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="441" y="124">Assess</text><text class="body" x="441" y="166">Inspect changed advisory records</text><text class="body" x="441" y="206">Match the application package</text><text class="body" x="441" y="246">Read the exact fixed version</text><path d="M 780 188 h 28 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#427b94" stroke-width="3"/><rect x="815" y="85" width="350" height="210" rx="12" fill="white" stroke="#427b94" stroke-width="2"/><text class="heading" x="831" y="124">Propose and verify</text><text class="body" x="831" y="166">Review the source update</text><text class="body" x="831" y="206">Test, build, sign, and assess</text><text class="body" x="831" y="246">Promote; refresh inventory evidence</text><text x="35" y="345" font-size="18">A checksum change is a signal to investigate. It does not establish that a fix applies to your application.</text></svg>
